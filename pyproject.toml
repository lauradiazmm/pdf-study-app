[project]
name = "pdf-study-app"
version = "0.1.0"
description = "Aplicación para estudiar documentos PDF con resúmenes y cuestionarios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.31.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false
